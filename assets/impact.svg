<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" role="img" aria-labelledby="title desc">
  <title id="title">Selected results</title>
  <desc id="desc">40-plus banks, 100-plus formats, 45 percent faster document verification, and approximately 35 percent faster data pipelines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1200" y1="0" y2="176" gradientUnits="userSpaceOnUse"><stop stop-color="#0D222A"/><stop offset="1" stop-color="#12252B"/></linearGradient>
    <style>
      .glow { animation: glow 3.5s ease-in-out infinite; }
      .glow2 { animation: glow 3.5s ease-in-out 1s infinite; }
      .glow3 { animation: glow 3.5s ease-in-out 2s infinite; }
      @keyframes glow { 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) { .glow, .glow2, .glow3 { animation: none !important; } }
    </style>
  </defs>
  <rect width="1200" height="176" rx="16" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1199" height="175" rx="15.5" fill="none" stroke="#2D555A"/>
  <path d="M400 30V146M800 30V146" stroke="#46676A" stroke-opacity=".62"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="49" cy="56" r="6" fill="#44DFC6" class="glow"/>
    <text x="74" y="64" fill="#B7CED0" font-size="15" letter-spacing="2">STATEMENT INTELLIGENCE</text>
    <text x="48" y="120" fill="#F4F8F6" font-size="43" font-weight="800">40+ / 100+</text>
    <text x="50" y="148" fill="#9FB9BA" font-size="16">banks / formats supported</text>

    <circle cx="449" cy="56" r="6" fill="#F8A475" class="glow2"/>
    <text x="474" y="64" fill="#B7CED0" font-size="15" letter-spacing="2">DOCUMENT AUTOMATION</text>
    <text x="448" y="120" fill="#F4F8F6" font-size="43" font-weight="800">45% faster</text>
    <text x="450" y="148" fill="#9FB9BA" font-size="16">verification cycle</text>

    <circle cx="849" cy="56" r="6" fill="#44DFC6" class="glow3"/>
    <text x="874" y="64" fill="#B7CED0" font-size="15" letter-spacing="2">DATA ENGINEERING</text>
    <text x="848" y="120" fill="#F4F8F6" font-size="43" font-weight="800">~35% faster</text>
    <text x="850" y="148" fill="#9FB9BA" font-size="16">pipeline execution</text>
  </g>
</svg>
