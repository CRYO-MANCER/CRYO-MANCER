<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Rishi Siva Kumar — AI/ML Engineer</title>
  <desc id="desc">An animated editorial banner with a living data network and the words build intelligence that works.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07131B"/>
      <stop offset="1" stop-color="#101E25"/>
    </linearGradient>
    <linearGradient id="signal" x1="710" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#44DFC6"/>
      <stop offset="1" stop-color="#F8A475"/>
    </linearGradient>
    <linearGradient id="line" x1="82" y1="374" x2="692" y2="374" gradientUnits="userSpaceOnUse">
      <stop stop-color="#44DFC6"/>
      <stop offset="1" stop-color="#44DFC6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aura"><stop stop-color="#1A9F93" stop-opacity=".38"/><stop offset="1" stop-color="#1A9F93" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" stroke="#79949A" stroke-opacity=".085" fill="none"/>
    </pattern>
    <clipPath id="frame"><rect x="12" y="12" width="1256" height="416" rx="20"/></clipPath>
    <style>
      .orbital { transform-origin: 995px 218px; animation: orbit 24s linear infinite; }
      .orbital-reverse { transform-origin: 995px 218px; animation: orbit 33s linear infinite reverse; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      .pulse-late { animation: pulse 3.2s ease-in-out 1.1s infinite; }
      .dash { stroke-dasharray: 6 11; animation: dash 16s linear infinite; }
      .float { animation: float 5s ease-in-out infinite; }
      .cursor { animation: blink 1.1s steps(2, start) infinite; }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes pulse { 50% { opacity: .35; transform: scale(.82); } }
      @keyframes dash { to { stroke-dashoffset: -170; } }
      @keyframes float { 50% { transform: translateY(-8px); } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .orbital, .orbital-reverse, .pulse, .pulse-late, .dash, .float, .cursor { animation: none !important; }
      }
    </style>
  </defs>

  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="url(#grid)"/>
    <circle cx="1000" cy="218" r="285" fill="url(#aura)"/>
    <path d="M0 372H1280" stroke="#405962" stroke-opacity=".27"/>
    <path d="M735 0V440" stroke="#405962" stroke-opacity=".27"/>

    <g fill="none" stroke="#4A7377">
      <circle cx="995" cy="218" r="170" stroke-opacity=".28"/>
      <circle cx="995" cy="218" r="126" stroke-opacity=".38" stroke-dasharray="2 8"/>
      <circle cx="995" cy="218" r="76" stroke-opacity=".46"/>
      <circle cx="995" cy="218" r="29" stroke="#44DFC6" stroke-opacity=".55"/>
    </g>

    <g class="orbital" fill="none" stroke="url(#signal)" stroke-width="2">
      <path d="M995 48A170 170 0 0 1 1165 218" stroke-opacity=".86"/>
      <circle cx="995" cy="48" r="7" fill="#44DFC6" stroke="none"/>
    </g>
    <g class="orbital-reverse" fill="none" stroke="#F8A475" stroke-width="2">
      <path d="M869 218A126 126 0 0 0 995 344" stroke-opacity=".75"/>
      <circle cx="995" cy="344" r="6" fill="#F8A475" stroke="none"/>
    </g>

    <g class="float">
      <path class="dash" d="M826 218H918M1072 218H1196M995 19V142M995 294V412" stroke="#5AD9C5" stroke-opacity=".46" fill="none" stroke-width="1.5"/>
      <path d="M929 218L995 152L1061 218L995 284Z" stroke="#44DFC6" stroke-opacity=".5" fill="#07131B"/>
      <circle cx="995" cy="218" r="46" fill="#0A2A2D" stroke="#44DFC6" stroke-width="2"/>
      <circle cx="995" cy="218" r="35" fill="#44DFC6" opacity=".08"/>
      <path d="M976 219L990 233L1016 202" stroke="#E2FFF8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <g font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="2">
      <rect x="779" y="77" width="102" height="27" rx="5" fill="#142D34" stroke="#38686A"/>
      <text x="795" y="95" fill="#8AE7D7">01 / DATA</text>
      <rect x="1099" y="93" width="129" height="27" rx="5" fill="#142D34" stroke="#38686A"/>
      <text x="1113" y="111" fill="#8AE7D7">02 / REASON</text>
      <rect x="1110" y="322" width="115" height="27" rx="5" fill="#142D34" stroke="#38686A"/>
      <text x="1124" y="340" fill="#8AE7D7">03 / BUILD</text>
    </g>

    <circle cx="790" cy="320" r="4" fill="#44DFC6" class="pulse"/>
    <circle cx="1206" cy="191" r="4" fill="#F8A475" class="pulse-late"/>
    <circle cx="1081" cy="389" r="3" fill="#44DFC6" class="pulse-late"/>

    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="78" y="57" width="205" height="28" rx="5" fill="#12363A" stroke="#278F85" stroke-opacity=".65"/>
      <circle cx="94" cy="71" r="4" fill="#44DFC6" class="pulse"/>
      <text x="109" y="76" fill="#9FE7DB" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="1.8">AI / ML ENGINEER</text>

      <text x="76" y="180" fill="#F2F7F4" font-size="82" font-weight="800" letter-spacing="-2">RISHI</text>
      <text x="76" y="263" fill="#F2F7F4" font-size="77" font-weight="800" letter-spacing="-3">SIVA KUMAR</text>
      <text x="79" y="314" fill="#F8A475" font-size="23" font-weight="600" letter-spacing=".6">Build intelligence that works.</text>

      <rect x="79" y="350" width="598" height="2" fill="url(#line)"/>
      <text x="80" y="390" fill="#B7CED0" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="1.1">agents  /  data  /  vision  /  products</text>
      <rect x="493" y="377" width="8" height="15" fill="#44DFC6" class="cursor"/>
    </g>
  </g>
  <rect x="12.5" y="12.5" width="1255" height="415" rx="19.5" fill="none" stroke="#3B7773" stroke-opacity=".46"/>
</svg>
