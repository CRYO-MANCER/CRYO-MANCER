<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="title desc">
  <title id="title">Let's build something useful</title>
  <desc id="desc">A closing invitation to connect with Rishi about an interesting problem.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1200" y1="0" y2="170" gradientUnits="userSpaceOnUse"><stop stop-color="#10292D"/><stop offset="1" stop-color="#071820"/></linearGradient>
    <style>
      .spark { animation: spark 2.8s ease-in-out infinite; }
      @keyframes spark { 50% { opacity: .36; transform: scale(.75); } }
